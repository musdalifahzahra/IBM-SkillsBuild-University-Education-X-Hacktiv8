<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sudoku</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ======================================================
       OVERLAY: PAUSE
  ====================================================== -->
  <div id="pause-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Game Paused">
    <div class="overlay-box">
      <div class="overlay-icon">⏸</div>
      <h2>Game Dijeda</h2>
      <p>Papan disembunyikan sementara waktu.</p>
      <button id="btn-resume" class="btn btn-primary btn-lg">▶ Lanjutkan</button>
    </div>
  </div>

  <!-- ======================================================
       OVERLAY: WIN
  ====================================================== -->
  <div id="win-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="You Won">
    <div class="overlay-box win-box">
      <div class="overlay-icon">🎉</div>
      <h2>Selamat!</h2>
      <p id="win-message">Anda berhasil menyelesaikan Sudoku.</p>
      <div class="win-stats">
        <div class="win-stat"><span class="win-stat-label">Waktu</span><span id="win-time" class="win-stat-value">–</span></div>
        <div class="win-stat"><span class="win-stat-label">Kesalahan</span><span id="win-mistakes" class="win-stat-value">–</span></div>
        <div class="win-stat"><span class="win-stat-label">Kesulitan</span><span id="win-difficulty" class="win-stat-value">–</span></div>
      </div>
      <button id="btn-new-game-win" class="btn btn-primary btn-lg">🎮 Main Lagi</button>
    </div>
  </div>

  <!-- ======================================================
       MAIN APP
  ====================================================== -->
  <div id="app">

    <!-- HEADER -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title">
          <span class="title-icon">◈</span> Sudoku
        </h1>
      </div>
      <div class="header-right">
        <!-- Difficulty selector -->
        <div class="difficulty-group" role="group" aria-label="Difficulty">
          <button class="diff-btn active" data-diff="easy">Easy</button>
          <button class="diff-btn" data-diff="medium">Medium</button>
          <button class="diff-btn" data-diff="hard">Hard</button>
        </div>
        <!-- New Game button -->
        <button id="btn-new-game" class="btn btn-primary" title="New Game">
          <svg viewBox="0 0 24 24" class="btn-icon"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 8 8h-2a6 6 0 1 1-1.76-4.24l-2.07 2.07H20V4l-2.35 2.35z"/></svg>
          New Game
        </button>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="game-layout">

      <!-- LEFT PANEL: Stats -->
      <aside class="stats-panel" aria-label="Game Statistics">

        <div class="stat-card">
          <div class="stat-icon timer-icon">⏱</div>
          <div class="stat-body">
            <span class="stat-label">Waktu</span>
            <span id="timer" class="stat-value mono">00:00</span>
          </div>
          <button id="btn-pause" class="icon-btn" title="Pause/Resume" aria-label="Pause">
            <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
        </div>

        <div class="stat-card">
          <div class="stat-icon mistake-icon">✗</div>
          <div class="stat-body">
            <span class="stat-label">Kesalahan</span>
            <span id="mistake-count" class="stat-value mono">0 / 3</span>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">🏆</div>
          <div class="stat-body">
            <span class="stat-label">Kesulitan</span>
            <span id="current-difficulty" class="stat-value">Easy</span>
          </div>
        </div>

        <!-- Number usage indicator -->
        <div class="number-tracker" aria-label="Number Usage">
          <p class="tracker-label">Angka Tersisa</p>
          <div class="tracker-grid" id="number-tracker">
            <!-- Filled by JS: buttons 1–9 with remaining count -->
          </div>
        </div>

      </aside>

      <!-- CENTER: Board -->
      <section class="board-section" aria-label="Sudoku Board">
        <div id="sudoku-board" class="sudoku-board" role="grid" aria-label="Sudoku Grid">
          <!-- 81 cells generated by JS -->
        </div>
      </section>

      <!-- RIGHT PANEL: Controls -->
      <aside class="controls-panel" aria-label="Game Controls">

        <!-- Action Buttons -->
        <div class="control-group">
          <button id="btn-undo" class="control-btn" title="Undo (Ctrl+Z)">
            <svg viewBox="0 0 24 24" class="ctrl-icon"><path d="M12.5 8c-2.65 0-5.05 1-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
            <span>Undo</span>
          </button>
          <button id="btn-erase" class="control-btn" title="Erase (Delete)">
            <svg viewBox="0 0 24 24" class="ctrl-icon"><path d="M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.77-.78 2.04 0 2.83L5.03 20H20v-2h-6.58l7.35-7.35a2 2 0 0 0 0-2.83l-4.22-4.22c-.39-.39-.9-.6-1.41-.6zm-1.42 2L18 9.28 16.28 11H9l4.72-6zM7 13h1.28L5 16.28 3.72 15 7 11.72V13z"/></svg>
            <span>Hapus</span>
          </button>
          <button id="btn-hint" class="control-btn" title="Hint">
            <svg viewBox="0 0 24 24" class="ctrl-icon"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
            <span>Hint</span>
          </button>
          <button id="btn-check" class="control-btn" title="Check Answer">
            <svg viewBox="0 0 24 24" class="ctrl-icon"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
            <span>Cek</span>
          </button>
        </div>

        <!-- Notes mode toggle -->
        <div class="notes-toggle-wrap">
          <button id="btn-notes" class="notes-btn" title="Toggle Notes Mode" aria-pressed="false">
            <svg viewBox="0 0 24 24" class="ctrl-icon"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            Catatan
            <span id="notes-badge" class="notes-badge off">OFF</span>
          </button>
        </div>

        <!-- Number pad -->
        <div class="numpad" role="group" aria-label="Number Input">
          <button class="num-btn" data-num="1">1</button>
          <button class="num-btn" data-num="2">2</button>
          <button class="num-btn" data-num="3">3</button>
          <button class="num-btn" data-num="4">4</button>
          <button class="num-btn" data-num="5">5</button>
          <button class="num-btn" data-num="6">6</button>
          <button class="num-btn" data-num="7">7</button>
          <button class="num-btn" data-num="8">8</button>
          <button class="num-btn" data-num="9">9</button>
        </div>

      </aside>

    </main>

    <!-- STATUS BAR -->
    <div id="status-bar" class="status-bar" aria-live="polite"></div>

  </div><!-- /#app -->

  <script src="script.js"></script>
</body>
</html>
